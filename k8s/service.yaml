# 1. Your existing service (rename it to active)
apiVersion: v1
kind: Service
metadata:
  name: my-app-service-active
spec:
  selector:
    app: my-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
# 2. Add this right below it
apiVersion: v1
kind: Service
metadata:
  name: my-app-service-preview
spec:
  selector:
    app: my-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80


