apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: my-app-rollout
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: my-app
        image: localhost/my-app:new-version
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        # --- ADD THESE PROBES ---
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        # ------------------------
  strategy:
    blueGreen: 
      activeService: my-app-service-active
      previewService: my-app-service-preview
      autoPromotionEnabled: false